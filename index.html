 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Luminary Studio AI — O Estúdio Definitivo para Escritores</title>
<meta name="description" content="Estúdio literário inteligente: cada obra é um universo isolado, com memória permanente e geração de capítulos guiada por IA." />
<meta name="theme-color" content="#050403" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LUMINARY STUDIO AI — DESIGN TOKENS
   A palette borrowed from illuminated manuscripts and old brass
   instruments, not from "dark mode SaaS #12". Every color here
   is desaturated on purpose — gold that has actually tarnished.
   ============================================================ */

:root {
  /* ---- Surface: never pure black, always a warm near-black ---- */
  --lum-black-absolute: #050403;
  --lum-black-charcoal: #0c0a08;
  --lum-graphite: #17140f;
  --lum-graphite-raised: #201b14;
  --lum-graphite-border: #2c2419;

  /* ---- Gold family: three distinct golds, used for different jobs ---- */
  --lum-gold-antique: #a3813f;   /* structural: rules, borders, icons at rest */
  --lum-gold-bright: #e8c168;    /* interactive: active state, focus, CTAs */
  --lum-bronze: #7a5a34;         /* recessed: disabled, secondary text on gold */
  --lum-gold-glow: rgba(232, 193, 104, 0.35);

  /* ---- Text ---- */
  --lum-cream: #efe6d4;          /* primary text — never pure white */
  --lum-cream-dim: #b9ac93;      /* secondary text */
  --lum-cream-faint: #7d735f;    /* tertiary / placeholder text */

  /* ---- Error: the only saturated color allowed in the system ---- */
  --lum-red-error: #b2453d;
  --lum-red-glow: rgba(178, 69, 61, 0.28);

  /* ---- Status accents (muted, never candy-colored) ---- */
  --lum-status-planning: #7d8f9e;
  --lum-status-writing: var(--lum-gold-bright);
  --lum-status-review: #a3813f;
  --lum-status-done: #7fa377;

  /* ---- Typography ---- */
  --lum-font-display: 'Cinzel Decorative', serif;   /* landing hero only */
  --lum-font-heading: 'Cinzel', serif;               /* section / obra titles */
  --lum-font-body: 'Crimson Pro', serif;              /* long-form reading text */
  --lum-font-ui: 'Inter', -apple-system, sans-serif;  /* interface chrome */

  /* ---- Spacing scale ---- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --sp-8: 64px;
  --sp-9: 96px;

  /* ---- Layout ---- */
  --lum-header-h: 64px;
  --lum-sidebar-w: 260px;
  --lum-sidebar-w-collapsed: 72px;
  --lum-radius-sm: 3px;
  --lum-radius-md: 6px;
  --lum-border-hairline: 1px solid var(--lum-graphite-border);

  /* ---- Motion ---- */
  --lum-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --lum-duration-fast: 160ms;
  --lum-duration-med: 420ms;
  --lum-duration-slow: 900ms;

  /* ---- Elevation (gold-tinted shadows, not generic black) ---- */
  --lum-shadow-card: 0 4px 24px rgba(5, 4, 3, 0.5), 0 1px 0 rgba(163, 129, 63, 0.08) inset;
  --lum-shadow-raised: 0 12px 48px rgba(5, 4, 3, 0.65);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --lum-duration-fast: 0ms;
    --lum-duration-med: 0ms;
    --lum-duration-slow: 0ms;
  }
}
/* ============================================================
   BASE — reset + global typography
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--lum-black-absolute);
  color: var(--lum-cream);
  font-family: var(--lum-font-ui);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body { min-height: 100vh; }

h1, h2, h3, h4 { margin: 0; font-family: var(--lum-font-heading); font-weight: 600; letter-spacing: 0.02em; }
p { margin: 0; }

a { color: var(--lum-gold-bright); text-decoration: none; }

button, input, select, textarea {
  font-family: var(--lum-font-ui);
  color: var(--lum-cream);
  background: transparent;
  border: none;
  outline: none;
}
button { cursor: pointer; }

::selection { background: var(--lum-gold-glow); color: var(--lum-cream); }

/* Visible keyboard focus everywhere — never remove this */
:focus-visible {
  outline: 2px solid var(--lum-gold-bright);
  outline-offset: 2px;
  border-radius: var(--lum-radius-sm);
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--lum-black-charcoal); }
::-webkit-scrollbar-thumb { background: var(--lum-graphite-border); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--lum-gold-antique); }

/* ---- Ornament utilities: the "illuminated manuscript" motif ---- */

.lum-hairline {
  border: none;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--lum-gold-antique) 20%, var(--lum-gold-antique) 80%, transparent);
  opacity: 0.5;
  margin: var(--sp-5) 0;
}

/* Corner flourish: a small drawn bracket used on cards instead of a generic border-radius box */
.lum-corners { position: relative; }
.lum-corners::before,
.lum-corners::after {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  border: 1px solid var(--lum-gold-antique);
  opacity: 0.55;
  pointer-events: none;
  transition: opacity var(--lum-duration-fast) var(--lum-ease);
}
.lum-corners::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.lum-corners::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
.lum-corners:hover::before, .lum-corners:hover::after { opacity: 1; }

.lum-eyebrow {
  font-family: var(--lum-font-ui);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--lum-gold-antique);
}

.lum-visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; margin: -1px;
}

.lum-scrollable { scrollbar-gutter: stable; }
/* ============================================================
   AGE GATE — shown before everything else
   ============================================================ */

#lum-age-gate {
  display: none;
}
#lum-age-gate.lum-agegate--active {
  display: flex;
  position: fixed;
  inset: 0;
  z-index: 500;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, var(--lum-graphite) 0%, var(--lum-black-absolute) 70%);
  padding: var(--sp-5);
}

.lum-agegate__content {
  max-width: 480px;
  text-align: center;
}

.lum-agegate__badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  border: 1px solid var(--lum-gold-antique);
  border-radius: 50%;
  font-family: var(--lum-font-heading);
  font-size: 15px;
  font-weight: 700;
  color: var(--lum-gold-bright);
  margin: 0 auto var(--sp-5);
  box-shadow: 0 0 24px var(--lum-gold-glow);
}

.lum-agegate__eyebrow { display: block; margin-bottom: var(--sp-3); }

.lum-agegate__title {
  font-family: var(--lum-font-heading);
  font-size: clamp(1.5rem, 5vw, 2rem);
  line-height: 1.25;
  color: var(--lum-cream);
  margin-bottom: var(--sp-4);
}
.lum-agegate__title em { font-style: normal; color: var(--lum-gold-bright); }

.lum-agegate__text {
  font-family: var(--lum-font-body);
  font-size: 14.5px;
  line-height: 1.7;
  color: var(--lum-cream-dim);
  margin-bottom: var(--sp-6);
}

.lum-agegate__actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-4);
}

.lum-agegate__decline {
  font-family: var(--lum-font-ui);
  font-size: 12.5px;
  color: var(--lum-cream-faint);
  text-decoration: underline;
  text-underline-offset: 3px;
  padding: var(--sp-2);
}
.lum-agegate__decline:hover { color: var(--lum-cream-dim); }

@media (max-width: 480px) {
  .lum-agegate__actions .lum-btn-enter { width: 100%; }
}
/* ============================================================
   LANDING — the threshold, not the product.
   Signature move: the title condenses out of drifting gold
   particles instead of just fading in.
   ============================================================ */

#lum-landing {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, var(--lum-graphite) 0%, var(--lum-black-absolute) 70%);
  transition: opacity var(--lum-duration-slow) var(--lum-ease), visibility var(--lum-duration-slow) var(--lum-ease);
}

#lum-landing.lum-landing--leaving {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#lum-particles-landing {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.lum-landing__content {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 640px;
  padding: 0 var(--sp-5);
  opacity: 0;
  transform: translateY(14px);
  animation: lum-rise 1.4s var(--lum-ease) 0.3s forwards;
}

@keyframes lum-rise {
  to { opacity: 1; transform: translateY(0); }
}

.lum-landing__mark {
  width: 46px;
  height: 46px;
  margin: 0 auto var(--sp-5);
  opacity: 0.85;
}

.lum-landing__eyebrow {
  display: block;
  margin-bottom: var(--sp-4);
}

.lum-landing__title {
  font-family: var(--lum-font-display);
  font-size: clamp(2.4rem, 7vw, 4.4rem);
  line-height: 1.08;
  color: var(--lum-cream);
  text-shadow: 0 0 40px var(--lum-gold-glow);
  margin: 0 0 var(--sp-4);
}

.lum-landing__title em {
  font-style: normal;
  color: var(--lum-gold-bright);
}

.lum-landing__subtitle {
  font-family: var(--lum-font-body);
  font-style: italic;
  font-size: clamp(1rem, 2.4vw, 1.25rem);
  color: var(--lum-cream-dim);
  max-width: 460px;
  margin: 0 auto var(--sp-7);
  line-height: 1.6;
}

.lum-landing__rule {
  width: 120px;
  margin: var(--sp-6) auto;
}

.lum-btn-enter {
  position: relative;
  font-family: var(--lum-font-ui);
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--lum-black-absolute);
  background: linear-gradient(180deg, var(--lum-gold-bright), var(--lum-gold-antique));
  padding: var(--sp-4) var(--sp-7);
  border-radius: var(--lum-radius-sm);
  font-weight: 600;
  transition: transform var(--lum-duration-fast) var(--lum-ease), box-shadow var(--lum-duration-fast) var(--lum-ease);
  box-shadow: 0 0 0 rgba(232, 193, 104, 0);
}

.lum-btn-enter:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px var(--lum-gold-glow);
}

.lum-btn-enter:active { transform: translateY(0); }

.lum-landing__hint {
  display: block;
  margin-top: var(--sp-5);
  font-size: 12px;
  color: var(--lum-cream-faint);
  font-family: var(--lum-font-ui);
}

@media (max-width: 520px) {
  .lum-btn-enter { width: 100%; padding: var(--sp-4); }
}
/* ============================================================
   LAYOUT — header, sidebar, main shell
   ============================================================ */

#lum-app {
  position: relative;
  min-height: 100vh;
  opacity: 0;
  transition: opacity var(--lum-duration-slow) var(--lum-ease);
}
#lum-app.lum-app--visible { opacity: 1; }

#lum-particles-ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
}

/* ---------------- HEADER ---------------- */

#lum-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--lum-header-h);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: 0 var(--sp-5);
  background: rgba(12, 10, 8, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: var(--lum-border-hairline);
}

.lum-header__brand {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  flex-shrink: 0;
}
.lum-header__brand svg { width: 22px; height: 22px; color: var(--lum-gold-bright); flex-shrink: 0; }
.lum-header__brand span {
  font-family: var(--lum-font-heading);
  font-size: 15px;
  letter-spacing: 0.06em;
  color: var(--lum-cream);
  white-space: nowrap;
}

.lum-header__menu-toggle {
  display: none;
  padding: var(--sp-2);
  color: var(--lum-cream-dim);
}

.lum-header__search {
  flex: 1;
  max-width: 420px;
  position: relative;
}
.lum-header__search input {
  width: 100%;
  padding: var(--sp-3) var(--sp-4) var(--sp-3) 38px;
  background: var(--lum-graphite);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-md);
  font-size: 13px;
  color: var(--lum-cream);
  transition: border-color var(--lum-duration-fast) var(--lum-ease);
}
.lum-header__search input::placeholder { color: var(--lum-cream-faint); }
.lum-header__search input:focus { border-color: var(--lum-gold-antique); }
.lum-header__search svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--lum-cream-faint); pointer-events: none;
}
.lum-header__search-results {
  position: absolute;
  top: calc(100% + 8px);
  left: 0; right: 0;
  background: var(--lum-graphite-raised);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-md);
  box-shadow: var(--lum-shadow-raised);
  max-height: 320px;
  overflow-y: auto;
  display: none;
}
.lum-header__search-results.lum-open { display: block; }
.lum-header__search-result {
  padding: var(--sp-3) var(--sp-4);
  font-size: 13px;
  border-bottom: 1px solid var(--lum-graphite-border);
  cursor: pointer;
}
.lum-header__search-result:last-child { border-bottom: none; }
.lum-header__search-result:hover { background: rgba(232, 193, 104, 0.06); }
.lum-header__search-result small { display: block; color: var(--lum-cream-faint); margin-top: 2px; }

.lum-header__spacer { flex: 1; }

.lum-header__actions {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  flex-shrink: 0;
}

.lum-select {
  padding: var(--sp-2) var(--sp-3);
  background: var(--lum-graphite);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-sm);
  font-size: 12px;
  color: var(--lum-cream-dim);
  appearance: none;
  cursor: pointer;
}

.lum-key-input {
  padding: var(--sp-2) var(--sp-3);
  background: var(--lum-graphite);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-sm);
  font-size: 13px;
  color: var(--lum-cream);
  width: 100%;
}
.lum-key-input:focus { border-color: var(--lum-gold-antique); }

/* AI quick-access popover: one trigger button, one panel, same on every
   screen size. Replaces an earlier version that kept a separate inline
   desktop row PLUS a separate mobile popover in sync — a single popover
   is simpler and has one less place for the two layouts to drift apart. */
.lum-header__ai-cluster {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  right: var(--sp-3);
  flex-direction: column;
  align-items: stretch;
  gap: var(--sp-3);
  background: var(--lum-graphite-raised);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-md);
  box-shadow: var(--lum-shadow-raised);
  padding: var(--sp-4);
  min-width: 240px;
  z-index: 250;
}
.lum-header__ai-cluster.lum-open { display: flex; }

.lum-ai-tabs {
  display: flex;
  gap: 6px;
}
.lum-ai-tab {
  flex: 1;
  padding: 8px 6px;
  border-radius: var(--lum-radius-sm);
  border: 1px solid var(--lum-graphite-border);
  background: transparent;
  color: var(--lum-cream-dim);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  transition: all var(--lum-duration-fast) var(--lum-ease);
}
.lum-ai-tab:hover { border-color: var(--lum-gold-antique); }
.lum-ai-tab--active {
  background: var(--lum-gold-bright);
  border-color: var(--lum-gold-bright);
  color: var(--lum-black-absolute);
}
.lum-ai-tab--configured:not(.lum-ai-tab--active)::after {
  content: '';
  position: absolute;
  top: 4px; right: 4px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--lum-status-done);
}

#lum-ai-quick-save {
  background: linear-gradient(180deg, var(--lum-gold-bright), var(--lum-gold-antique));
  color: var(--lum-black-absolute);
}

#lum-btn-gerenciar-ia {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: var(--sp-2);
  color: var(--lum-cream-faint);
}
#lum-btn-gerenciar-ia:hover { color: var(--lum-gold-bright); }

.lum-header__ai-toggle { display: flex; position: relative; }

.lum-icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  border-radius: var(--lum-radius-sm);
  color: var(--lum-cream-dim);
  transition: background var(--lum-duration-fast) var(--lum-ease), color var(--lum-duration-fast) var(--lum-ease);
  position: relative;
}
.lum-icon-btn:hover { background: rgba(232, 193, 104, 0.08); color: var(--lum-gold-bright); }
.lum-icon-btn svg { width: 18px; height: 18px; }

.lum-key-status {
  position: absolute;
  bottom: 5px; right: 5px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--lum-cream-faint);
  border: 1px solid var(--lum-black-charcoal);
}
.lum-key-status.lum-key-status--ok { background: var(--lum-status-done); }
.lum-key-status.lum-key-status--missing { background: var(--lum-red-error); }

/* ---------------- SIDEBAR ---------------- */

#lum-sidebar {
  position: fixed;
  top: var(--lum-header-h);
  left: 0;
  bottom: 0;
  width: var(--lum-sidebar-w);
  background: var(--lum-black-charcoal);
  border-right: var(--lum-border-hairline);
  z-index: 90;
  display: flex;
  flex-direction: column;
  transition: width var(--lum-duration-med) var(--lum-ease), transform var(--lum-duration-med) var(--lum-ease);
  overflow-y: auto;
  overflow-x: hidden;
}

#lum-sidebar.lum-sidebar--collapsed { width: var(--lum-sidebar-w-collapsed); }

.lum-sidebar__collapse-toggle {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: var(--sp-3) var(--sp-4);
  flex-shrink: 0;
}
.lum-sidebar__collapse-toggle button { color: var(--lum-cream-faint); padding: var(--sp-2); }
.lum-sidebar__collapse-toggle button:hover { color: var(--lum-gold-bright); }

.lum-nav {
  list-style: none;
  margin: 0;
  padding: var(--sp-2) var(--sp-3);
  flex: 1;
}

.lum-nav__section-label {
  font-family: var(--lum-font-ui);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--lum-cream-faint);
  padding: var(--sp-4) var(--sp-3) var(--sp-2);
  white-space: nowrap;
  overflow: hidden;
}
#lum-sidebar.lum-sidebar--collapsed .lum-nav__section-label { opacity: 0; height: 0; padding: 0; }

.lum-nav__item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  border-radius: var(--lum-radius-sm);
  color: var(--lum-cream-dim);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  margin-bottom: 2px;
  transition: background var(--lum-duration-fast) var(--lum-ease), color var(--lum-duration-fast) var(--lum-ease);
  position: relative;
}
.lum-nav__item:hover { background: rgba(232, 193, 104, 0.06); color: var(--lum-cream); }
.lum-nav__item.lum-nav__item--active { background: rgba(232, 193, 104, 0.1); color: var(--lum-gold-bright); }
.lum-nav__item.lum-nav__item--active::before {
  content: '';
  position: absolute; left: -12px; top: 8px; bottom: 8px; width: 2px;
  background: var(--lum-gold-bright);
}
.lum-nav__item svg { width: 17px; height: 17px; flex-shrink: 0; }
.lum-nav__item span { overflow: hidden; text-overflow: ellipsis; }
#lum-sidebar.lum-sidebar--collapsed .lum-nav__item span { display: none; }
#lum-sidebar.lum-sidebar--collapsed .lum-nav__item { justify-content: center; }

.lum-sidebar__footer {
  padding: var(--sp-4);
  border-top: var(--lum-border-hairline);
  flex-shrink: 0;
}
.lum-sidebar__obra-atual {
  font-size: 11px;
  color: var(--lum-cream-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lum-sidebar__obra-atual strong { display: block; color: var(--lum-gold-antique); font-family: var(--lum-font-heading); font-size: 13px; margin-bottom: 2px; }
#lum-sidebar.lum-sidebar--collapsed .lum-sidebar__footer { display: none; }

#lum-sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(5, 4, 3, 0.7);
  z-index: 80;
}
#lum-sidebar-overlay.lum-open { display: block; }

/* ---------------- MAIN ---------------- */

#lum-main {
  margin-left: var(--lum-sidebar-w);
  margin-top: var(--lum-header-h);
  padding: var(--sp-6);
  min-height: calc(100vh - var(--lum-header-h));
  position: relative;
  z-index: 1;
  transition: margin-left var(--lum-duration-med) var(--lum-ease);
}
#lum-app.lum-sidebar-collapsed #lum-main { margin-left: var(--lum-sidebar-w-collapsed); }

.lum-view {
  max-width: 1240px;
  margin: 0 auto;
  animation: lum-view-in 0.5s var(--lum-ease);
}
@keyframes lum-view-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.lum-view__header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
  flex-wrap: wrap;
}
.lum-view__title {
  font-family: var(--lum-font-heading);
  font-size: 26px;
  color: var(--lum-cream);
}
.lum-view__subtitle {
  font-family: var(--lum-font-body);
  font-style: italic;
  color: var(--lum-cream-dim);
  font-size: 14px;
  margin-top: var(--sp-2);
}

/* ---------------- RESPONSIVE ---------------- */

@media (max-width: 960px) {
  .lum-header__search { max-width: none; }
  #lum-sidebar {
    transform: translateX(-100%);
    width: 280px;
  }
  #lum-sidebar.lum-sidebar--drawer-open { transform: translateX(0); }
  #lum-sidebar.lum-sidebar--collapsed { width: 280px; }
  #lum-main { margin-left: 0; padding: var(--sp-4); }
  #lum-app.lum-sidebar-collapsed #lum-main { margin-left: 0; }
  .lum-header__menu-toggle { display: flex; }
  .lum-sidebar__collapse-toggle { display: none; }
}

@media (max-width: 600px) {
  #lum-header { padding: 0 var(--sp-3); gap: var(--sp-2); }
  .lum-header__brand span { display: none; }
  .lum-view__title { font-size: 21px; }
}

/* ============================================================
   COMPONENTS
   ============================================================ */

/* ---- Buttons ---- */

.lum-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-5);
  border-radius: var(--lum-radius-sm);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: transform var(--lum-duration-fast) var(--lum-ease), box-shadow var(--lum-duration-fast) var(--lum-ease), background var(--lum-duration-fast) var(--lum-ease);
  white-space: nowrap;
}
.lum-btn--primary {
  color: var(--lum-black-absolute);
  background: linear-gradient(180deg, var(--lum-gold-bright), var(--lum-gold-antique));
}
.lum-btn--primary:hover { box-shadow: 0 6px 20px var(--lum-gold-glow); transform: translateY(-1px); }
.lum-btn--ghost {
  color: var(--lum-cream-dim);
  border: var(--lum-border-hairline);
  background: transparent;
}
.lum-btn--ghost:hover { border-color: var(--lum-gold-antique); color: var(--lum-gold-bright); }
.lum-btn--danger { color: var(--lum-red-error); border: 1px solid rgba(178, 69, 61, 0.4); }
.lum-btn--danger:hover { background: var(--lum-red-glow); }
.lum-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.lum-btn svg { width: 15px; height: 15px; }

/* ---- Cards ---- */

.lum-card {
  background: var(--lum-graphite);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-md);
  padding: var(--sp-5);
  box-shadow: var(--lum-shadow-card);
}

.lum-stat-card {
  padding: var(--sp-4);
}
.lum-stat-card__label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--lum-cream-faint);
  margin-bottom: var(--sp-2);
}
.lum-stat-card__value {
  font-family: var(--lum-font-heading);
  font-size: 26px;
  color: var(--lum-gold-bright);
}
.lum-stat-card__hint { font-size: 12px; color: var(--lum-cream-faint); margin-top: var(--sp-1); }

.lum-stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
}

.lum-panel-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: var(--sp-5);
}
@media (max-width: 900px) { .lum-panel-grid { grid-template-columns: 1fr; } }

/* ---- Empty state ---- */

.lum-empty {
  text-align: center;
  padding: var(--sp-9) var(--sp-5);
  color: var(--lum-cream-faint);
}
.lum-empty svg { width: 40px; height: 40px; color: var(--lum-gold-antique); opacity: 0.6; margin-bottom: var(--sp-4); }
.lum-empty h3 { font-family: var(--lum-font-heading); color: var(--lum-cream-dim); font-size: 18px; margin-bottom: var(--sp-2); }
.lum-empty p { font-size: 13px; max-width: 340px; margin: 0 auto var(--sp-5); line-height: 1.6; }

/* ---- Forms ---- */

.lum-field { margin-bottom: var(--sp-4); }
.lum-field label {
  display: block;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--lum-cream-dim);
  margin-bottom: var(--sp-2);
}
.lum-field .lum-field__hint { font-size: 11px; color: var(--lum-cream-faint); margin-top: var(--sp-1); }
.lum-field input[type="text"],
.lum-field input[type="number"],
.lum-field input[type="password"],
.lum-field select,
.lum-field textarea {
  width: 100%;
  padding: var(--sp-3) var(--sp-4);
  background: var(--lum-black-charcoal);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-sm);
  font-size: 13.5px;
  color: var(--lum-cream);
  transition: border-color var(--lum-duration-fast) var(--lum-ease);
}
.lum-field textarea { resize: vertical; min-height: 90px; font-family: var(--lum-font-body); font-size: 14.5px; line-height: 1.6; }
.lum-field input:focus, .lum-field select:focus, .lum-field textarea:focus { border-color: var(--lum-gold-antique); }
.lum-field input::placeholder, .lum-field textarea::placeholder { color: var(--lum-cream-faint); }
.lum-field select { appearance: none; cursor: pointer; }

.lum-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
@media (max-width: 560px) { .lum-field-row { grid-template-columns: 1fr; } }

.lum-field-error { color: var(--lum-red-error); font-size: 11px; margin-top: var(--sp-1); display: none; }
.lum-field--invalid input, .lum-field--invalid textarea, .lum-field--invalid select { border-color: var(--lum-red-error); }
.lum-field--invalid .lum-field-error { display: block; }

/* ---- Modal ---- */

.lum-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(5, 4, 3, 0.78);
  backdrop-filter: blur(3px);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-5);
  opacity: 0;
  transition: opacity var(--lum-duration-fast) var(--lum-ease);
}
.lum-modal-overlay.lum-open { opacity: 1; }

.lum-modal {
  background: var(--lum-graphite-raised);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-md);
  box-shadow: var(--lum-shadow-raised);
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  transform: translateY(12px) scale(0.98);
  transition: transform var(--lum-duration-med) var(--lum-ease);
}
.lum-modal-overlay.lum-open .lum-modal { transform: translateY(0) scale(1); }
.lum-modal--wide { max-width: 780px; }

.lum-modal__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-5);
  border-bottom: var(--lum-border-hairline);
  flex-shrink: 0;
}
.lum-modal__title { font-family: var(--lum-font-heading); font-size: 18px; color: var(--lum-cream); }
.lum-modal__body { padding: var(--sp-5); overflow-y: auto; }
.lum-modal__footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-3);
  padding: var(--sp-5);
  border-top: var(--lum-border-hairline);
  flex-shrink: 0;
}

/* ---- Wizard (Nova Obra) ---- */

.lum-wizard__steps {
  display: flex;
  gap: var(--sp-2);
  margin-bottom: var(--sp-5);
  padding: 0 var(--sp-5);
}
.lum-wizard__step-dot {
  flex: 1;
  height: 2px;
  background: var(--lum-graphite-border);
  border-radius: 2px;
  transition: background var(--lum-duration-fast) var(--lum-ease);
}
.lum-wizard__step-dot.lum-active { background: var(--lum-gold-bright); }
.lum-wizard__step-dot.lum-done { background: var(--lum-gold-antique); }
.lum-wizard__step-label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--lum-gold-antique);
  padding: 0 var(--sp-5);
  margin-bottom: var(--sp-4);
}

/* ---- Gaveta (book shelf grid) ---- */

.lum-shelf-toolbar {
  display: flex;
  gap: var(--sp-3);
  align-items: center;
  margin-bottom: var(--sp-5);
  flex-wrap: wrap;
}
.lum-shelf-toolbar .lum-field { margin: 0; flex: 1; min-width: 180px; }

.lum-shelf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: var(--sp-5);
}

.lum-book {
  cursor: pointer;
  transition: transform var(--lum-duration-fast) var(--lum-ease);
}
.lum-book:hover { transform: translateY(-4px); }

.lum-book__cover {
  aspect-ratio: 2 / 3;
  border-radius: var(--lum-radius-sm) var(--lum-radius-sm) 2px 2px;
  background: linear-gradient(155deg, var(--lum-graphite-raised), var(--lum-black-charcoal));
  border: 1px solid var(--lum-graphite-border);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: var(--sp-4);
  position: relative;
  overflow: hidden;
  box-shadow: var(--lum-shadow-card);
}
.lum-book__cover::before {
  content: '';
  position: absolute; left: 12px; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(var(--lum-gold-antique), transparent 70%);
  opacity: 0.4;
}
.lum-book__cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.lum-book__genre { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lum-gold-antique); position: relative; z-index: 1; }
.lum-book__title {
  font-family: var(--lum-font-heading);
  font-size: 15px;
  line-height: 1.25;
  color: var(--lum-cream);
  margin: var(--sp-1) 0;
  position: relative; z-index: 1;
}
.lum-book__author { font-size: 11px; color: var(--lum-cream-dim); position: relative; z-index: 1; }

.lum-book__fav {
  position: absolute; top: var(--sp-3); right: var(--sp-3);
  z-index: 2;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  color: var(--lum-cream-faint);
  background: rgba(5,4,3,0.5);
  border-radius: 50%;
}
.lum-book__fav.lum-active, .lum-book__fav:hover { color: var(--lum-gold-bright); }
.lum-book__fav svg { width: 13px; height: 13px; }

.lum-book__meta {
  padding-top: var(--sp-2);
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--lum-cream-faint);
}

.lum-progress {
  height: 3px;
  background: var(--lum-graphite-border);
  border-radius: 2px;
  overflow: hidden;
  margin-top: var(--sp-2);
}
.lum-progress__fill { height: 100%; background: linear-gradient(90deg, var(--lum-gold-antique), var(--lum-gold-bright)); }

.lum-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  letter-spacing: 0.04em;
  padding: 3px 8px;
  border-radius: 3px;
  background: rgba(232, 193, 104, 0.1);
  color: var(--lum-gold-bright);
}
.lum-badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.lum-badge--planning { color: var(--lum-status-planning); background: rgba(125, 143, 158, 0.12); }
.lum-badge--review { color: var(--lum-status-review); background: rgba(163, 129, 63, 0.14); }
.lum-badge--done { color: var(--lum-status-done); background: rgba(127, 163, 119, 0.12); }

/* ---- Dropdown menu (context menu on book / user menu) ---- */

.lum-menu {
  position: absolute;
  background: var(--lum-graphite-raised);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-md);
  box-shadow: var(--lum-shadow-raised);
  min-width: 180px;
  z-index: 250;
  padding: var(--sp-2);
  display: none;
}
.lum-menu.lum-open { display: block; }
.lum-menu__item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  font-size: 13px;
  color: var(--lum-cream-dim);
  border-radius: var(--lum-radius-sm);
  cursor: pointer;
}
.lum-menu__item:hover { background: rgba(232, 193, 104, 0.08); color: var(--lum-gold-bright); }
.lum-menu__item svg { width: 14px; height: 14px; }
.lum-menu__item--danger { color: var(--lum-red-error); }
.lum-menu__item--danger:hover { background: var(--lum-red-glow); color: var(--lum-red-error); }
.lum-menu__divider { height: 1px; background: var(--lum-graphite-border); margin: var(--sp-2) 0; }

/* ---- Placeholder view (modules not yet built) ---- */

.lum-soon {
  text-align: center;
  padding: var(--sp-9) var(--sp-5);
}
.lum-soon .lum-eyebrow { display: block; margin-bottom: var(--sp-3); }
.lum-soon h2 { font-family: var(--lum-font-heading); font-size: 24px; color: var(--lum-cream); margin-bottom: var(--sp-3); }
.lum-soon p { color: var(--lum-cream-dim); max-width: 420px; margin: 0 auto; line-height: 1.7; font-family: var(--lum-font-body); font-size: 15px; }

/* ---- Toast ---- */

#lum-toast-stack {
  position: fixed;
  bottom: var(--sp-5);
  right: var(--sp-5);
  z-index: 400;
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.lum-toast {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  background: var(--lum-graphite-raised);
  border: var(--lum-border-hairline);
  border-left: 2px solid var(--lum-gold-bright);
  border-radius: var(--lum-radius-sm);
  padding: var(--sp-3) var(--sp-4);
  box-shadow: var(--lum-shadow-raised);
  font-size: 13px;
  min-width: 220px;
  max-width: 320px;
  animation: lum-toast-in 0.3s var(--lum-ease);
}
.lum-toast--error { border-left-color: var(--lum-red-error); }
@keyframes lum-toast-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }

@media (max-width: 600px) {
  #lum-toast-stack { left: var(--sp-3); right: var(--sp-3); bottom: var(--sp-3); }
  .lum-toast { max-width: none; }
}
/* ============================================================
   ANIMATIONS — the "forja literária" loading experience
   ============================================================ */

.lum-forge {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: var(--sp-8) var(--sp-5);
}

.lum-forge__canvas-wrap {
  width: 100%;
  max-width: 280px;
  height: 180px;
  margin-bottom: var(--sp-5);
  border-radius: var(--lum-radius-md);
  overflow: hidden;
  background: var(--lum-black-absolute);
  box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
}

.lum-forge__message {
  font-family: var(--lum-font-heading);
  font-size: 15px;
  color: var(--lum-cream);
  min-height: 22px;
  transition: opacity var(--lum-duration-fast) var(--lum-ease);
}
.lum-forge__message.lum-fade { opacity: 0; }

.lum-forge__bar {
  width: 220px;
  height: 2px;
  background: var(--lum-graphite-border);
  border-radius: 2px;
  margin-top: var(--sp-5);
  overflow: hidden;
}
.lum-forge__bar-fill {
  height: 100%;
  width: 30%;
  background: linear-gradient(90deg, transparent, var(--lum-gold-bright), transparent);
  animation: lum-forge-sweep 1.6s ease-in-out infinite;
}
@keyframes lum-forge-sweep {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(400%); }
}

canvas.lum-particle-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* Simple fade-in used across dynamically injected views */
.lum-fade-in { animation: lum-fade-in 0.4s var(--lum-ease); }
@keyframes lum-fade-in { from { opacity: 0; } to { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .lum-forge__bar-fill { animation: none; width: 100%; }
}
/* ============================================================
   CAPÍTULOS — list + editor
   ============================================================ */

/* ---- Chapter list ---- */

.lum-chapter-row {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-4);
  border-bottom: 1px solid var(--lum-graphite-border);
  cursor: pointer;
  transition: background var(--lum-duration-fast) var(--lum-ease);
}
.lum-chapter-row:hover { background: rgba(232, 193, 104, 0.05); }
.lum-chapter-row:last-child { border-bottom: none; }

.lum-chapter-row__num {
  font-family: var(--lum-font-heading);
  font-size: 22px;
  color: var(--lum-gold-antique);
  width: 44px;
  text-align: center;
  flex-shrink: 0;
}
.lum-chapter-row__body { flex: 1; min-width: 0; }
.lum-chapter-row__title { font-family: var(--lum-font-heading); font-size: 15px; color: var(--lum-cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lum-chapter-row__meta { font-size: 12px; color: var(--lum-cream-faint); margin-top: 2px; }
.lum-chapter-row__status {
  flex-shrink: 0;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 3px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.lum-chapter-row__status--rascunho { background: rgba(125, 143, 158, 0.12); color: var(--lum-status-planning); }
.lum-chapter-row__status--gerado { background: rgba(127, 163, 119, 0.12); color: var(--lum-status-done); }

/* ---- Chip input (eventos obrigatórios/proibidos, personagens presentes) ---- */

.lum-chip-input {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: var(--sp-3);
  background: var(--lum-black-charcoal);
  border: var(--lum-border-hairline);
  border-radius: var(--lum-radius-sm);
  min-height: 46px;
}
.lum-chip-input:focus-within { border-color: var(--lum-gold-antique); }
.lum-chip-input input {
  flex: 1;
  min-width: 120px;
  background: none;
  border: none;
  padding: 4px;
  font-size: 13px;
  color: var(--lum-cream);
}
.lum-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px 4px 10px;
  background: rgba(232, 193, 104, 0.1);
  color: var(--lum-gold-bright);
  border-radius: 4px;
  font-size: 12.5px;
  white-space: nowrap;
}
.lum-chip button { display: flex; color: inherit; opacity: 0.7; padding: 2px; }
.lum-chip button:hover { opacity: 1; }
.lum-chip--proibido { background: rgba(178, 69, 61, 0.14); color: #d98b83; }

/* ---- Multiselect chips (focos, ênfases, tom emocional) ---- */

.lum-multiselect {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.lum-multiselect-chip {
  padding: 7px 13px;
  border-radius: 20px;
  border: 1px solid var(--lum-graphite-border);
  font-size: 12.5px;
  color: var(--lum-cream-dim);
  cursor: pointer;

const { icon } = __require('utils/icons');

function renderBackup(container) {

          <input type="file" accept="application/json" id="lum-import-input" style="display:none;" />

        </div>
      </div>
    </div>

  const fileInput = container.querySelector('#lum-import-input');
  container.querySelector('#lum-import-btn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) importAll(file);
  });
}

async function exportAll() {
  try {
    const dump = {};
    for (const store of ALL_STORES) {
      dump[store] = await db.getAll(store);
    }
    const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), stores: dump }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `luminary-studio-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Backup baixado.');
  } catch (err) {
    toast('Falha ao exportar: ' + err.message, { type: 'error' });
  }
}

async function importAll(file) {
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    if (!parsed.stores) throw new Error('Arquivo não parece um backup válido.');
    for (const store of ALL_STORES) {
      const records = parsed.stores[store] || [];
      await db.clear(store);
      for (const rec of records) await db.put(store, rec);
    }
    toast('Backup restaurado. Recarregando…');
    setTimeout(() => location.reload(), 1200);
  } catch (err) {
    toast('Falha ao importar: ' + err.message, { type: 'error' });
  }
}


  Object.assign(exports, { renderBackup });
});

async function renderCapituloForm(container, obraId, numeroStr) {
  const numero = parseInt(numeroStr, 10);
  const obra = await obraService.get(obraId);
  if (!obra) {
    container.innerHTML = `<div class="lum-view"><div class="lum-empty lum-card lum-corners"><h3>Obra não encontrada</h3></div></div>`;
    return;
  }
  appState.set('obraAtiva', obra);
  appState.set('view', 'capitulos');

  let capitulo = await capituloService.ensureDraft(obraId, numero);
  const todos = await capituloService.listByObra(obraId);
  const capituloAnterior = todos.find((c) => c.numero === numero - 1 && c.status === 'gerado') || null;
  const resumosAnteriores = todos
    .filter((c) => c.numero < numero - 1 && c.status === 'gerado' && c.resumo)
    .map((c) => ({ numero: c.numero, resumo: c.resumo }));
  const arcosDoCapitulo = await arcoService.listForChapter(obraId, numero);
  const personagensCadastrados = await personagemService.listByObra(obraId);

  container.innerHTML = `
    <div class="lum-view" style="max-width:920px;">
      <div class="lum-view__header">
        <div>
          <span class="lum-eyebrow">${escapeHtml(obra.titulo)} · Capítulo ${numero}</span>
          <h1 class="lum-view__title" style="margin-top:6px;">${capitulo.titulo ? escapeHtml(capitulo.titulo) : 'Novo Capítulo'}</h1>
          <p class="lum-view__subtitle" id="lum-autosave-indicator">${capituloAnterior ? `Continuando direto do Capítulo ${capituloAnterior.numero}` : 'Primeiro capítulo da obra'}</p>
        </div>
        <button class="lum-btn lum-btn--ghost" id="lum-btn-voltar-caps">← Capítulos</button>
      </div>

      ${arcosDoCapitulo.length ? `
        <div class="lum-card lum-corners" style="margin-bottom:var(--sp-4);border-color:rgba(232,193,104,0.3);">
          <span class="lum-eyebrow">${icon('flag', { size: 11 })} Do Planejamento</span>
          <p style="font-size:12.5px;color:var(--lum-cream-dim);margin-top:6px;line-height:1.5;">
            ${arcosDoCapitulo.map((a) => `<strong style="color:var(--lum-gold-antique);">${escapeHtml(a.titulo)}</strong>${a.descricao ? ' — ' + escapeHtml(a.descricao) : ''}`).join('<br/>')}
          </p>
        </div>
      ` : ''}

      <div class="lum-card lum-corners" style="margin-bottom:var(--sp-5);">
        ${formSections(capitulo, obra)}
      </div>

      <button class="lum-btn lum-btn--primary" id="lum-btn-forjar" style="width:100%;justify-content:center;padding:var(--sp-4);font-size:14px;">
        ${icon('spark', { size: 16 })} ${capitulo.status === 'gerado' ? 'Forjar Novamente' : 'Forjar Capítulo'}
      </button>

      <div id="lum-result-area" style="margin-top:var(--sp-6);"></div>
    </div>
  `;

  container.querySelector('#lum-btn-voltar-caps').addEventListener('click', () => router.navigate(`/capitulos/${obraId}`));

  const dlPersonagens = container.querySelector('#dl-personagens-cadastrados');
  if (dlPersonagens) {
    dlPersonagens.innerHTML = personagensCadastrados.map((p) => `<option value="${escapeHtml(p.nome)}">`).join('');
  }

  wireFormInteractivity(container, capitulo, obraId);
  wireAutosave(container, capitulo);

  if (capitulo.status === 'gerado') {
    renderResult(container.querySelector('#lum-result-area'), capitulo);
  }

  container.querySelector('#lum-btn-forjar').addEventListener('click', () =>
    handleForjar(container, obra, capitulo, capituloAnterior, resumosAnteriores)
  );
}

function multiChips(options, selected = []) {
  return options.map((o) => `<div class="lum-multiselect-chip ${selected.includes(o) ? 'lum-active' : ''}" data-value="${esc(o)}">${o}</div>`).join('');
}

function opts(list, selected) {
  return list.map((v) => `<option value="${v}" ${v === selected ? 'selected' : ''}>${v}</option>`).join('');
}
function esc(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

/* ---------------- INTERACTIVITY ---------------- */

function mountChipField(el, initial, onChange) {
  let chips = [...initial];
  const variant = el.dataset.variant === 'proibido' ? ' lum-chip--proibido' : '';
  function render() {
    const input = el.querySelector('input');
    const value = input ? input.value : '';
    el.innerHTML = chips.map((c) => `<span class="lum-chip${variant}">${esc(c)}<button type="button" data-remove="${esc(c)}">${icon('close', { size: 11 })}</button></span>`).join('') +
      `<input type="text" placeholder="${el.dataset.placeholder || ''}" value="${esc(value)}" ${el.dataset.list ? `list="${el.dataset.list}"` : ''} />`;
    el.querySelector('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        e.preventDefault();
        chips.push(e.target.value.trim());
        onChange(chips);
        render();
        el.querySelector('input').focus();
      } else if (e.key === 'Backspace' && !e.target.value && chips.length) {
        chips.pop();
        onChange(chips);
        render();
      }
    });
    el.querySelectorAll('[data-remove]').forEach((btn) => {
      btn.addEventListener('click', () => {
        chips = chips.filter((c) => c !== btn.dataset.remove);
        onChange(chips);
        render();
      });
    });
  }
  render();
  return { get: () => chips };
}

function wireFormInteractivity(container, capitulo, obraId) {
  const chipsObrigatorios = mountChipField(container.querySelector('#f-chips-obrigatorios'), capitulo.eventosObrigatorios, () => {});
  const chipsProibidos = mountChipField(container.querySelector('#f-chips-proibidos'), capitulo.eventosProibidos, () => {});
  const chipsPersonagens = mountChipField(container.querySelector('#f-chips-personagens'), capitulo.personagensPresentes, () => {});
  container._chips = { chipsObrigatorios, chipsProibidos, chipsPersonagens };

  let focos = new Set(capitulo.focos);
  let enfases = new Set(capitulo.enfases);
  let tons = new Set(capitulo.tomEmocional);
  container._multiselect = { focos, enfases, tons };

  function wireMulti(id, set) {
    container.querySelectorAll(`#${id} .lum-multiselect-chip`).forEach((chip) => {
      chip.addEventListener('click', () => {
        const v = chip.dataset.value;
        if (set.has(v)) set.delete(v); else set.add(v);
        chip.classList.toggle('lum-active');
      });
    });
  }
  wireMulti('f-focos', focos);
  wireMulti('f-enfases', enfases);
  wireMulti('f-tons', tons);

  const ritmoInput = container.querySelector('#f-ritmo');
  ritmoInput.addEventListener('input', () => {
    container.querySelector('#f-ritmo-label').textContent = RITMO_LABELS[ritmoInput.value];
  });
  const intensidadeInput = container.querySelector('#f-intensidade');
  intensidadeInput.addEventListener('input', () => {
    container.querySelector('#f-intensidade-label').textContent = `${intensidadeInput.value}/5`;
  });

  container.querySelectorAll('[data-preset]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const preset = PRESETS[btn.dataset.preset];
      ritmoInput.value = preset.ritmo;
      container.querySelector('#f-ritmo-label').textContent = RITMO_LABELS[preset.ritmo];
      intensidadeInput.value = preset.intensidadeGeral;
      container.querySelector('#f-intensidade-label').textContent = `${preset.intensidadeGeral}/5`;
      focos.clear(); preset.focos.forEach((f) => focos.add(f));
      enfases.clear(); preset.enfases.forEach((f) => enfases.add(f));
      tons.clear(); preset.tomEmocional.forEach((f) => tons.add(f));
      container.querySelectorAll('#f-focos .lum-multiselect-chip').forEach((chip) => chip.classList.toggle('lum-active', focos.has(chip.dataset.value)));
      container.querySelectorAll('#f-enfases .lum-multiselect-chip').forEach((chip) => chip.classList.toggle('lum-active', enfases.has(chip.dataset.value)));
      container.querySelectorAll('#f-tons .lum-multiselect-chip').forEach((chip) => chip.classList.toggle('lum-active', tons.has(chip.dataset.value)));
      container.querySelector('.lum-disclosure').open = true;
      toast(`Preset "${btn.dataset.preset}" aplicado.`);
    });
  });
}

function collectFormData(container) {
  const q = (id) => container.querySelector(id)?.value ?? '';
  return {
    titulo: q('#f-titulo'), subtitulo: q('#f-subtitulo'), pov: q('#f-pov'),
    palavrasDesejadas: Number(q('#f-palavras')) || 0,
    pessoaNarrativa: q('#f-pessoa'), tempoVerbal: q('#f-tempo'),
    objetivo: q('#f-objetivo'),
    eventosObrigatorios: container._chips.chipsObrigatorios.get(),
    eventosProibidos: container._chips.chipsProibidos.get(),
    personagensPresentes: container._chips.chipsPersonagens.get(),
    ambientacao: {
      local: q('#f-local'), subLocal: q('#f-sublocal'), horario: q('#f-horario'),
      clima: q('#f-clima'), sensacao: q('#f-sensacao'), detalhes: q('#f-ambdetalhes'),
    },
    ritmo: Number(q('#f-ritmo')),
    focos: [...container._multiselect.focos],
    enfases: [...container._multiselect.enfases],
    tomEmocional: [...container._multiselect.tons],
    nivelLiterario: q('#f-nivel'),
    intensidadeGeral: Number(q('#f-intensidade')),
    regrasEspecificas: q('#f-regras'),
  };
}

function wireAutosave(container, capitulo) {
  const indicator = container.querySelector('#lum-autosave-indicator');
  const save = debounce(async () => {
    const data = collectFormData(container);
    await capituloService.update(capitulo.id, data);
    Object.assign(capitulo, data);
    if (indicator) {
      const prev = indicator.textContent;
      indicator.textContent = 'Rascunho salvo automaticamente';
      setTimeout(() => { if (indicator.textContent === 'Rascunho salvo automaticamente') indicator.textContent = prev; }, 1800);
    }
  }, 600);

  container.querySelectorAll('input, textarea, select').forEach((el) => {
    el.addEventListener('input', save);
    el.addEventListener('change', save);
  });
  container.querySelectorAll('.lum-multiselect-chip, .lum-chip-input, [data-preset]').forEach((el) => {
    el.addEventListener('click', save);
  });
}

/* ---------------- GENERATION ---------------- */

async function getActiveAIConfig() {
  const active = await aiKeyService.getActive();
  if (!active) return { provider: null, apiKey: null, model: null, keyId: null };
  return { provider: active.fornecedor, apiKey: active.chave, model: active.modelo, keyId: active.id };
}

async function handleForjar(container, obra, capitulo, capituloAnterior, resumosAnteriores) {
  const { provider, apiKey, model, keyId } = await getActiveAIConfig();
  if (!apiKey) {
    toast('Nenhuma chave de API cadastrada. Cadastre uma no Gerenciador de IA antes de forjar.', { type: 'error' });
    router.navigate('/ia');
    return;
  }

  const formData = collectFormData(container);
  await capituloService.update(capitulo.id, formData);
  Object.assign(capitulo, formData);

  const resultArea = container.querySelector('#lum-result-area');
  const btn = container.querySelector('#lum-btn-forjar');
  btn.disabled = true;

  const loader = forgeLoader(resultArea, [
    'Consultando a Bíblia da Obra…',
    'Lendo a memória narrativa…',
    'Conectando os personagens…',
    'Forjando o capítulo…',
    'Polindo a narrativa…',
    'Identificando novos personagens no texto…',
  ]);

  const startedAt = Date.now();
  try {
    const localTexto = (capitulo.ambientacao?.local || '').trim().toLowerCase();
    let lugarCorrespondente = null;
    if (localTexto) {
      const lugares = await lugarService.listByObra(obra.id);
      lugarCorrespondente = lugares.find((l) => l.nome.trim().toLowerCase() === localTexto) || null;
    }

    const personagensCorrespondentes = [];
    for (const nomeChip of capitulo.personagensPresentes || []) {
      const match = await personagemService.findByName(obra.id, nomeChip);
      if (match) personagensCorrespondentes.push(match);
    }
    const elencoCompleto = await personagemService.listByObra(obra.id);

    const { systemPrompt, userPrompt } = buildChapterPrompt({ obra, capitulo, capituloAnterior, resumosAnteriores, lugarCorrespondente, personagensCorrespondentes, elencoCompleto });
    const { text } = await aiService.generateText({ provider, apiKey, model, systemPrompt, userPrompt, temperature: 1.0 });
    const elapsed = Date.now() - startedAt;
    await aiKeyService.recordUsage(keyId);
    await aiKeyService.recordResult(keyId, { ok: true });

    const parsed = aiService.parseJsonResponse(text);
    const finalTexto = parsed?.texto || text;
    const finalResumo = parsed?.resumo || '';
    const finalTitulo = parsed?.titulo || capitulo.titulo;

    if (!parsed) {
      toast('A IA não respondeu no formato esperado — salvei o texto bruto mesmo assim, nada foi perdido.', { type: 'error' });
    }

    const updated = await capituloService.saveGeneration(capitulo.id, {
      texto: finalTexto, resumo: finalResumo, modeloUtilizado: model || provider, tempoGeracaoMs: elapsed,
    });
    if (finalTitulo && finalTitulo !== capitulo.titulo) {
      await capituloService.update(capitulo.id, { titulo: finalTitulo });
      updated.titulo = finalTitulo;
    }
    Object.assign(capitulo, updated);

    // Best-effort: identifica personagens novos/sem nome no texto e cadastra
    // sozinho, pra próximos capítulos já saberem o nome. O capítulo em si já
    // está salvo acima — se isso falhar, não afeta o que o escritor já tem.
    const extracao = await extracaoPersonagensService.extrairESalvar({
      obraId: obra.id, chapterText: finalTexto, provider, apiKey, model,
    });

    loader.stop();
    renderResult(resultArea, capitulo);
    toast('Capítulo forjado.');
    if (extracao.criados.length) {
      const nomes = extracao.criados.map((c) => c.nome).join(', ');
      toast(`Personagem${extracao.criados.length > 1 ? 's' : ''} detectado${extracao.criados.length > 1 ? 's' : ''} e cadastrado${extracao.criados.length > 1 ? 's' : ''}: ${nomes}. Vale revisar a ficha.`, { duration: 6000 });
    }
  } catch (err) {
    loader.stop();
    if (keyId) await aiKeyService.recordResult(keyId, { ok: false, errorMsg: err.message });
    const friendly = friendlyErrorMessage(err);
    resultArea.innerHTML = `
      <div class="lum-card lum-corners" style="border-color:rgba(178,69,61,0.4);">
        <h3 style="color:var(--lum-red-error);font-family:var(--lum-font-heading);font-size:15px;margin-bottom:var(--sp-2);">Não foi possível gerar</h3>
